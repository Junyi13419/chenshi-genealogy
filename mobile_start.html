<style>

  .bg-pattern{position:fixed;inset:-40px;opacity:.14;background-image:

      background-size:80px 80px;animation:patternDrift 60s linear infinite;}
  @keyframes patternDrift{to{background-position:80px 80px;}}
  .bg-vignette{position:fixed;inset:0;pointer-events:none;
      box-shadow:inset 0 0 220px 90px rgba(0,0,0,.9), inset 0 0 60px 10px rgba(0,0,0,.6);}
  #particles{position:fixed;inset:0;pointer-events:none;}

  /* 角饰 */
  .corner{position:fixed;width:76px;height:76px;pointer-events:none;opacity:.55;}
  .corner::before,.corner::after{content:"";position:absolute;background:linear-gradient(90deg,var(--gold2),transparent);}
  .corner::before{height:1px;width:100%;top:0;left:0;}
  .corner::after{width:1px;height:100%;top:0;left:0;}
  .corner i{position:absolute;width:6px;height:6px;background:var(--gold3);transform:rotate(45deg);top:4px;left:4px;box-shadow:0 0 8px var(--gold2);}

  .c-tr{top:14px;right:14px;transform:scaleX(-1);}
  .c-bl{bottom:14px;left:14px;transform:scaleY(-1);}
  .c-br{bottom:14px;right:14px;transform:scale(-1,-1);}

  /* ===== 主体 ===== */
  .stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:24px 20px;text-align:center;z-index:5;}
  .stage > *{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both;}
  .stage > :nth-child(1){animation-delay:.1s;}
  .stage > :nth-child(2){animation-delay:.35s;}
  .stage > :nth-child(3){animation-delay:.6s;}
  .stage > :nth-child(4){animation-delay:.85s;}
  .stage > :nth-child(5){animation-delay:1.05s;}
  @keyframes rise{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:none;}}

  .emblem-wrap::before{content:"";position:absolute;inset:-14%;border-radius:50%;

  .emblem-wrap svg{width:100%;height:100%;filter:drop-shadow(0 0 22px rgba(212,175,55,.3));}

  .spin-slow{transform-origin:200px 200px;animation:spin 70s linear infinite;}
  .spin-rev{transform-origin:200px 200px;animation:spin 48s linear infinite reverse;}
  .spin-txt{transform-origin:200px 200px;animation:spin 38s linear infinite;}

  .bagua-still{transform-origin:200px 200px;}
  .taiji-spin{transform-origin:200px 200px;animation:spin 16s linear infinite reverse;}

      padding:14px 0;text-decoration:none;overflow:hidden;width:100%;

  .enter-btn::after,.sub-btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,246,208,.35),transparent);transform:skewX(-22deg);

  .enter-btn{border-color:rgba(212,175,55,.8);color:var(--gold4);font-weight:700;}
  .enter-btn:active,.sub-btn:active{transform:scale(.97);border-color:var(--gold3);color:#fff9e2;}
  .arrow{transition:.3s;}
  .enter-btn:active .arrow,.sub-btn:active .arrow{transform:translateX(4px);}

  .footline{margin-top:22px;font-size:10px;letter-spacing:.28em;color:rgba(247,230,168,.35);}

  .veil{position:fixed;inset:0;background:var(--bg0);opacity:0;pointer-events:none;transition:opacity .6s ease;z-index:50;}

  :focus-visible{outline:2px solid var(--gold3);outline-offset:3px;}
  @media(prefers-reduced-motion:reduce){.bg-rays,.bg-pattern{animation:none!important;}}
</style>

      W=innerWidth; H=innerHeight;
      c.width=W*dpr; c.height=H*dpr; c.style.width=W+'px'; c.style.height=H+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ps=[];
      var n=Math.min(46,Math.max(24,Math.floor(W/16)));
      for(var i=0;i<n;i++) ps.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.3+.3,
        vy:-(Math.random()*.16+.03), a:Math.random()*.5+.1, ph:Math.random()*6.28});
    }
    function draw(t){
      ctx.clearRect(0,0,W,H);
      for(var i=0;i<ps.length;i++){
        var p=ps[i]; p.y+=p.vy; if(p.y<-4){p.y=H+4;p.x=Math.random()*W;}
        var al=p.a*(.5+.5*Math.sin(t*.001+p.ph));
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28);
        ctx.fillStyle='rgba(247,230,168,'+al.toFixed(3)+')';
        ctx.shadowBlur=5; ctx.shadowColor='rgba(212,175,55,.8)'; ctx.fill();
      }
      ctx.shadowBlur=0; requestAnimationFrame(draw);
    }
    addEventListener('resize', init); init(); requestAnimationFrame(draw);
  })();

  /* 按钮跳转：淡出过渡 + 线上 sharecode 透传 */
  (function(){
    var btns = document.querySelectorAll('.enter-btn, .sub-btn');
    var m = location.search.match(/[?&]sharecode=([^&]+)/);
    function appendSC(url){
      if(!m) return url;
      if(url.indexOf('sharecode=')>=0) return url;
      var hashIdx = url.indexOf('#');
      if(hashIdx>=0) return url.slice(0,hashIdx) + '?sharecode=' + encodeURIComponent(m[1]) + url.slice(hashIdx);
      return url + '?sharecode=' + encodeURIComponent(m[1]);
    }
    btns.forEach(function(btn){
      btn.setAttribute('href', appendSC(btn.getAttribute('href')));
      btn.addEventListener('click', function(){
        var veil=document.getElementById('veil');
        veil.style.opacity='1';
        setTimeout(function(){ window.location.href = btn.getAttribute('href'); }, 720);
      });
    });
  })();
</script>
